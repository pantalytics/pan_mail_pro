name: gitleaks

# The mainline on `push`, everything else through the pull request that carries
# it -- see the comment in ci.yml for why a branch no longer runs both. The two
# scans differ: a push scans the full history, a pull request scans its own
# diff, so the mainline keeps the deeper one.
on:
  push:
    branches: ['19.0']
  pull_request:
    branches: ['**']
  merge_group:

jobs:
  scan:
    name: Scan for secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          VERSION=8.21.2
          # To a file, not into a pipe. Bash reports the *last* command's exit
          # status, so a curl that hands back an error page instead of a
          # tarball exits 0 and the only thing in the log is "gzip: stdin: not
          # in gzip format" -- a failure with no cause named, which cost two
          # runs to diagnose. --fail turns an HTTP error into an error, and
          # --retry rides out the release CDN rate-limiting that caused it.
          curl --fail --silent --show-error --location \
               --retry 5 --retry-delay 2 --retry-all-errors \
               --output gitleaks.tar.gz \
               "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          sudo tar -xzf gitleaks.tar.gz -C /usr/local/bin gitleaks
          rm gitleaks.tar.gz
          gitleaks version

      - name: Run gitleaks (PR diff)
        if: github.event_name == 'pull_request'
        run: |
          gitleaks detect \
            --config .gitleaks.toml \
            --no-banner \
            --redact \
            --log-opts="--no-merges ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"

      # Everything that is not a pull request, so a merge queue entry is scanned
      # too. `== 'push'` would have left merge_group matching neither step: the
      # job would go green having scanned nothing, which is the shape of green
      # this repo distrusts most.
      - name: Run gitleaks (full history)
        if: github.event_name != 'pull_request'
        run: |
          gitleaks detect \
            --config .gitleaks.toml \
            --no-banner \
            --redact
