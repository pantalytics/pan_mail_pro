name: CI

# `push` is the mainline only. A branch with an open pull request matches both
# triggers, so every push to it used to start two identical ten-minute runs --
# and because a pull request is red if *either* reports red, running twice made
# a flaky check twice as likely to block a merge while proving nothing extra.
# It happened on the pull request that wrote this comment: the two runs on one
# commit disagreed. A branch pushed before its pull request exists now has no
# run, which is the case `tools/ci.sh` covers locally.
#
# `merge_group` is what the merge queue on `19.0` waits for. Without it the
# queue's required checks never report and it stalls forever, so it belongs
# here in the same change that asks for the queue to be turned on.
on:
  push:
    branches: ['19.0']
  pull_request:
    branches: ['**']
  merge_group:

# Cancel superseded runs on the same branch — keeps mobile push-often workflows
# cheap. Never on a merge queue entry: a cancelled check is one the queue keeps
# waiting for, and the entry it belongs to is already the only one of its kind.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

# Nothing here writes to the repository; release.yml asks for contents:write
# separately. Stated explicitly so a compromised action cannot use the default
# token to push.
permissions:
  contents: read

# Every job below is a thin wrapper around a script in tools/. The checks
# themselves live there so the same commands run on a runner, on a laptop and
# in a Claude cloud session — a check that only exists in this YAML is a check
# you cannot run before pushing.
jobs:
  # ---------------------------------------------------------------------------
  # Static checks: fast, no database. Fails the PR before we spend 4 minutes
  # booting Odoo. Local equivalent: tools/ci.sh lint
  # ---------------------------------------------------------------------------
  lint:
    name: Lint and Odoo 19 checklist
    runs-on: ubuntu-latest
    steps:
      # Full history: the diff-shape and version-bump checks need a merge base
      # with the mainline, and a shallow clone has none — which fails outright
      # the moment the branch carries a merge commit.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install ruff
        run: pip install ruff==0.14.0

      # BASE_REF switches on the two checks that need something to compare
      # against. Empty on the mainline itself, where there is nothing.
      - name: Static checks
        env:
          BASE_REF: >-
            ${{ github.ref_name == github.event.repository.default_branch && ''
                || format('origin/{0}', github.event.pull_request.base.ref || github.event.repository.default_branch) }}
        run: |
          if [ -n "$BASE_REF" ]; then
            git fetch --no-tags --depth=200 origin "${BASE_REF#origin/}"
          fi
          tools/ci_lint.sh

  # ---------------------------------------------------------------------------
  # That the version is *untouched*, not that it was raised: the mainline
  # raises it after the merge (.github/workflows/release.yml), so a branch that
  # writes it is a merge conflict waiting for whoever merges second. The one
  # exception is a branch adding a migration, which has to name its version.
  #
  # Kept as its own job because it is a required status check by name -- and
  # that name is why this one is wrong. The job asserts the version is
  # *untouched*, so "bumped" describes the opposite; but branch protection on
  # `19.0` matches the string, and a check that no longer reports under the
  # name the rule names blocks every merge until somebody edits a repository
  # setting. The honest name is one settings change away, and it is not worth
  # holding a merge for.
  # Local equivalent: tools/ci_version_bump.sh origin/19.0
  # ---------------------------------------------------------------------------
  version-bump:
    name: Manifest version bumped
    runs-on: ubuntu-latest
    # Skipped on the mainline itself, where there is nothing to compare against.
    if: github.ref_name != github.event.repository.default_branch
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compare manifest version with the mainline
        run: |
          BASE_BRANCH="${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}"
          git fetch --no-tags --depth=200 origin "$BASE_BRANCH"
          tools/ci_version_bump.sh FETCH_HEAD

  # ---------------------------------------------------------------------------
  # Install the module into a real Odoo of the matching series and run the
  # module's own test suite. Uses the official community image; the module only
  # depends on mail/base/crm, which all ship there. Enterprise-only tests
  # (helpdesk) skip themselves. Local equivalent: tools/ci.sh test
  # ---------------------------------------------------------------------------
  # The job name is static on purpose: it is a required status check, and a
  # name interpolated from the manifest would stop matching on a branch for a
  # different Odoo series.
  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v7

      - name: Fresh install and run the suite
        run: tools/ci_odoo.sh --mode=fresh

      - name: Upload Odoo log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: odoo-test-log
          path: odoo-test.log
          retention-days: 7

  # ---------------------------------------------------------------------------
  # The `test` job installs fresh. Every customer database instead *upgrades*,
  # which is a different code path: it runs the scripts in migrations/, and it
  # runs the test suite against columns and records that already existed. Until
  # this job existed, neither was exercised anywhere automatic — migrations only
  # ever ran for the first time on a customer's database.
  #
  # Out of scope on purpose: the pan_outlook_pro -> pan_mail_pro rename, which
  # happens outside Odoo (tools/rename_to_mail_pro.sql) and so cannot be driven
  # from a module upgrade. That one stays a manual runbook.
  #
  # Local equivalent: tools/ci.sh upgrade
  # ---------------------------------------------------------------------------
  # ---------------------------------------------------------------------------
  # The pages, in a browser. The suite asserts that a view renders; nothing was
  # asserting that it reads. The setup checklist ran the full width of the
  # window and the provider line showed a selection code, both invisible to 456
  # passing tests. This job boots a seeded Odoo, walks every menu the module
  # declares and checks the shapes that broke before; the screenshots are kept
  # as an artifact, so a layout change is reviewable without checking the
  # branch out.
  #
  # Local equivalent: pip install playwright && tools/ci.sh ui
  # ---------------------------------------------------------------------------
  ui:
    name: UI checks
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Playwright
        run: |
          pip install playwright==1.62.0
          playwright install --with-deps chromium

      - name: Boot a seeded Odoo and check the pages
        run: tools/ci_ui.sh

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-screenshots
          path: ui-screenshots/
          retention-days: 7

  upgrade:
    name: Upgrade from ${{ matrix.from }}
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        # The previous release (the customer who upgrades every time) and
        # 19.0.7.17.0, the newest tag below both migration folders that still
        # exist (19.0.7.18.0 and 19.0.8.0.0): the customer who skipped a
        # quarter crosses both in one -u, and only this row tries that. An
        # empty tag lets tools/ci_odoo.sh pick the previous release itself.
        include:
          - from: previous release
            tag: ''
          - from: v19.0.7.17.0
            tag: v19.0.7.17.0
    env:
      FROM_TAG: ${{ matrix.tag }}
    steps:
      # Tags and full history: the script upgrades from the newest v<series>.*
      # tag that is not HEAD.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install the last release, upgrade to HEAD, run the suite
        run: tools/ci_odoo.sh --mode=upgrade

      - name: Upload upgrade logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: odoo-upgrade-log-${{ matrix.tag || 'previous' }}
          path: |
            odoo-baseline.log
            odoo-upgrade.log
          retention-days: 7
