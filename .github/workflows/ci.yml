name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

# Cancel superseded runs on the same branch — keeps mobile push-often workflows cheap.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Static checks: fast, no database. Fails the PR before we spend 4 minutes
  # booting Odoo.
  # ---------------------------------------------------------------------------
  lint:
    name: Lint and Odoo 19 checklist
    runs-on: ubuntu-latest
    outputs:
      odoo-series: ${{ steps.manifest.outputs.series }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # The Odoo series to test against is derived from the manifest version
      # (19.0.1.3.0 -> 19.0). A future 18.0 branch therefore tests against
      # Odoo 18 without touching this workflow.
      - name: Read Odoo series from manifest
        id: manifest
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import ast
          manifest = ast.literal_eval(open('__manifest__.py').read())
          version = manifest['version']
          parts = version.split('.')
          assert len(parts) == 5, f"version must be <series>.<x>.<y>.<z> style, got {version!r}"
          print(f"series={parts[0]}.{parts[1]}")
          print(f"version={version}")
          PY

      - name: Show resolved series
        run: echo "Testing against Odoo ${{ steps.manifest.outputs.series }} (manifest ${{ steps.manifest.outputs.version }})"

      - name: Install ruff
        run: pip install ruff==0.14.0

      - name: Lint with ruff
        run: ruff check . --output-format=github

      - name: Check XML is well-formed
        run: |
          python - <<'PY'
          import os, sys
          from xml.etree import ElementTree
          # os.walk, not rglob: the repo carries a `pan_mail_pro -> .`
          # symlink for the local Docker addons_path, and rglob would follow it
          # forever. os.walk does not follow directory symlinks by default.
          failed = checked = 0
          for root, dirs, files in os.walk('.'):
              dirs[:] = [d for d in dirs if d not in {'.git', '__pycache__'}]
              for name in files:
                  if not name.endswith('.xml'):
                      continue
                  path = os.path.join(root, name)
                  checked += 1
                  try:
                      ElementTree.parse(path)
                  except ElementTree.ParseError as exc:
                      print(f"::error file={path}::{exc}")
                      failed += 1
          print(f"Parsed {checked} XML file(s), {failed} malformed.")
          sys.exit(1 if failed else 0)
          PY

      # These mirror the "Odoo 19 Checklist" in CLAUDE.md so the rules are
      # enforced by CI instead of by remembering them at commit time.
      - name: Odoo 19 — no attrs= in views
        run: |
          if grep -rn 'attrs=' --include='*.xml' .; then
            echo "::error::'attrs=' is removed in Odoo 17+. Use invisible/readonly/required directly."
            exit 1
          fi
          echo "OK: no attrs= found."

      - name: Odoo 19 — no numbercall on cron records
        run: |
          if grep -rn 'name="numbercall"' --include='*.xml' .; then
            echo "::error::'numbercall' is deprecated on ir.cron in Odoo 17+."
            exit 1
          fi
          echo "OK: no numbercall found."

      - name: Boundary — anthropic imported only inside models/ai/
        run: |
          if grep -rn 'import anthropic\|from anthropic' --include='*.py' . \
             | grep -v '^./models/ai/'; then
            echo "::error::The AI vendor SDK may only be imported inside models/ai/."
            echo "Everything else must go through the pan.mail.ai contract."
            exit 1
          fi
          echo "OK: AI vendor boundary intact."

      - name: Boundary — no AI call inside the mail path
        run: |
          if grep -n 'get_ai_backend\|pan\.mail\.ai' models/pan_mail_fetcher.py models/mail_mail.py; then
            echo "::error::AI must never be called from the fetcher or the send path."
            echo "Both run in a cron inside a savepoint; a slow or failing model"
            echo "call there stalls a mailbox and rolls the message back."
            exit 1
          fi
          echo "OK: AI cannot block mail."

      - name: Boundary — provider SDKs stay inside models/providers/
        run: |
          if grep -rn 'graph\.microsoft\.com\|gmail\.googleapis\.com' \
             --include='*.py' . | grep -v '^./models/providers/' | grep -v '^./tests/'; then
            echo "::error::Provider URLs may only appear inside models/providers/."
            exit 1
          fi
          echo "OK: provider boundary intact."

      - name: Migration folder is not below the manifest version
        run: |
          VERSION=$(python -c "import ast,pathlib;print(ast.literal_eval(pathlib.Path('__manifest__.py').read_text())['version'])")
          LATEST=$(ls migrations 2>/dev/null | sort -V | tail -1)
          if [ -n "$LATEST" ]; then
            HIGHEST=$(printf '%s\n%s\n' "$VERSION" "$LATEST" | sort -V | tail -1)
            if [ "$HIGHEST" != "$VERSION" ]; then
              echo "::error::migrations/$LATEST is above manifest version $VERSION."
              exit 1
            fi
            if [ "$LATEST" = "$VERSION" ]; then
              echo "OK: migrations/$LATEST runs on upgrade to $VERSION."
            else
              echo "OK: latest migration $LATEST is below $VERSION (already applied)."
            fi
          fi

      - name: Models changed implies tests changed
        if: github.event_name == 'pull_request'
        run: |
          BASE="origin/${{ github.base_ref }}"
          git fetch --quiet origin "${{ github.base_ref }}"
          CHANGED=$(git diff --name-only "$BASE"...HEAD)
          if echo "$CHANGED" | grep -q '^models/' && ! echo "$CHANGED" | grep -q '^tests/'; then
            echo "::error::This PR changes models/ but no test. Add or update one."
            exit 1
          fi
          echo "OK: model changes are accompanied by tests."

      - name: Manifest data files exist
        run: |
          python - <<'PY'
          import ast, pathlib, sys
          manifest = ast.literal_eval(open('__manifest__.py').read())
          missing = [f for f in manifest.get('data', []) if not pathlib.Path(f).is_file()]
          missing += [f for f in manifest.get('assets', {}).get('web.assets_backend', [])
                      if not pathlib.Path(f.split('/', 1)[1]).is_file()]
          if missing:
              print("Referenced in __manifest__.py but missing on disk:")
              print("\n".join(f"  - {m}" for m in missing))
              sys.exit(1)
          print("All manifest data/asset files exist.")
          PY

  # ---------------------------------------------------------------------------
  # Odoo hosts decide whether to run an upgrade by comparing the manifest
  # version to the installed one. A code change that ships without a bump is
  # simply never applied on the target database — so it is checked here, but
  # only when module code actually changed.
  # ---------------------------------------------------------------------------
  version-bump:
    name: Manifest version bumped
    runs-on: ubuntu-latest
    # Skipped on the mainline itself, where there is nothing to compare against.
    if: github.ref_name != github.event.repository.default_branch
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Compares against the merge base with the mainline rather than against
      # the PR's base SHA, so this also runs on a plain branch push — before a
      # PR exists, which is when the bump is easiest to forget.
      - name: Compare manifest version with the mainline
        run: |
          BASE_BRANCH="${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}"
          git fetch --no-tags --depth=200 origin "$BASE_BRANCH"
          BASE=$(git merge-base FETCH_HEAD HEAD)
          echo "Comparing against ${BASE_BRANCH} at ${BASE}"
          CODE_CHANGED=$(git diff --name-only "$BASE" HEAD \
            -- 'models/**' 'views/**' 'wizard/**' 'controllers/**' \
               'security/**' 'data/**' 'migrations/**' 'static/**' '__manifest__.py' \
            | wc -l)
          if [ "$CODE_CHANGED" -eq 0 ]; then
            echo "No module code touched — version bump not required."
            exit 0
          fi
          python - "$BASE" <<'PY'
          import ast, subprocess, sys
          base = sys.argv[1]

          def version_of(text):
              return tuple(int(p) for p in ast.literal_eval(text)['version'].split('.'))

          new = version_of(open('__manifest__.py').read())
          old = version_of(subprocess.run(
              ['git', 'show', f'{base}:__manifest__.py'],
              capture_output=True, text=True, check=True).stdout)

          if new <= old:
              print(f"::error file=__manifest__.py::Module code changed but version was not "
                    f"bumped ({'.'.join(map(str, old))} -> {'.'.join(map(str, new))}). "
                    f"Odoo skips the upgrade without a higher version.")
              sys.exit(1)
          print(f"Version bumped: {'.'.join(map(str, old))} -> {'.'.join(map(str, new))}")
          PY

  # ---------------------------------------------------------------------------
  # Install the module into a real Odoo of the matching series and run the
  # module's own test suite. Uses the official community image; the module
  # only depends on mail/base/crm, which all ship there. Enterprise-only
  # tests (helpdesk) skip themselves.
  # ---------------------------------------------------------------------------
  # The job name is static on purpose: it is a required status check, and a
  # name interpolated from the manifest would stop matching on a branch for a
  # different Odoo series.
  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      # Check out into a subdirectory so the parent can serve as addons_path
      # without relying on the in-repo `pan_mail_pro -> .` symlink.
      - uses: actions/checkout@v7
        with:
          path: addons/pan_mail_pro

      # --log-handler=odoo.tools.convert:DEBUG is deliberate and permanent.
      # Without it, a bad view fails with "Invalid view <name> definition" and
      # "View error context: '-no context-'", which says only *that* the view
      # is wrong, never *why*. Odoo hides the underlying validation error
      # behind that handler; leaving it on costs a few extra lines on success
      # and turns an unreadable failure into an actionable one.
      - name: Run module tests
        env:
          SERIES: ${{ needs.lint.outputs.odoo-series }}
        run: |
          set -o pipefail
          docker run --rm --network host \
            -v "${{ github.workspace }}/addons:/mnt/extra-addons:ro" \
            --entrypoint odoo "odoo:${SERIES}" \
            -d ci_test \
            --db_host=localhost --db_port=5432 --db_user=odoo --db_password=odoo \
            --addons-path=/usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons \
            -i pan_mail_pro \
            --test-enable --test-tags=pan_mail_pro \
            --stop-after-init --without-demo=all \
            --max-cron-threads=0 --log-level=info \
            --log-handler=odoo.tools.convert:DEBUG 2>&1 | tee odoo-test.log

      # Belt and braces: the step above already fails on a non-zero Odoo exit
      # code. This also asserts on the summary line, so a run that dies before
      # reporting one cannot pass silently.
      #
      # The pattern is anchored on odoo.tests.result on purpose. A looser match
      # picks up ordinary log lines from tests that exercise failure paths
      # ("Email 41 failed to send") and fails a green build.
      - name: Assert no test failures
        run: |
          SUMMARY=$(grep -oE 'odoo\.tests\.result: [0-9]+ failed, [0-9]+ error\(s\)[^"]*' odoo-test.log | tail -1)
          if [ -z "$SUMMARY" ]; then
            echo "::error::Odoo printed no test summary — the run died before finishing."
            tail -30 odoo-test.log
            exit 1
          fi
          echo "$SUMMARY"
          case "$SUMMARY" in
            *": 0 failed, 0 error(s)"*)
              grep -E 'odoo\.tests\.stats' odoo-test.log | tail -1
              echo "All tests passed." ;;
            *)
              echo "::error::$SUMMARY"
              grep -E 'tests\.[a-z_]+: (ERROR|FAIL):' odoo-test.log | head -30
              exit 1 ;;
          esac

      - name: Upload Odoo log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: odoo-test-log
          path: odoo-test.log
          retention-days: 7
