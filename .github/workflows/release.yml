name: Release

# Tags the merge commit with the manifest version and publishes a release for
# it. The tag gives every version a fixed point to deploy from or roll back to,
# which matters because Odoo hosts (Odoo.sh, CloudPepper) pull a git ref rather
# than a package. The release gives that ref a readable description — up to
# 19.0.7.7.0 there were thirteen tags and no releases, so "what changed in the
# version I am about to deploy" was a git log away instead of a click.
on:
  push:
    branches:
      - '19.0'

permissions:
  contents: write

jobs:
  tag:
    name: Tag and release manifest version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read manifest version
        id: manifest
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import ast
          print("version=" + ast.literal_eval(open('__manifest__.py').read())['version'])
          PY

      # Not every merge is a release — docs and CI changes land without a bump.
      # Re-tagging an existing version would move the tag under anyone who
      # already deployed it, so skip instead.
      - name: Create tag if new
        id: tag
        env:
          VERSION: ${{ steps.manifest.outputs.version }}
        run: |
          if git rev-parse "v${VERSION}" >/dev/null 2>&1; then
            echo "Tag v${VERSION} already exists — nothing to release."
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v${VERSION}" -m "pan_mail_pro ${VERSION}"
          git push origin "v${VERSION}"
          echo "created=true" >> "$GITHUB_OUTPUT"
          echo "Tagged v${VERSION}"

      # --generate-notes writes the merged pull requests since the previous
      # release, which is the changelog this repo would otherwise have to keep
      # by hand — and a hand-kept one drifts the first time somebody merges in
      # a hurry. The install line is what a customer actually needs from a
      # release page: the ref to pull.
      - name: Publish the release
        if: steps.tag.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.manifest.outputs.version }}
        run: |
          gh release create "v${VERSION}" \
            --title "pan_mail_pro ${VERSION}" \
            --generate-notes \
            --notes-file - <<EOF
          Odoo 19.0 · install from this tag:

          \`\`\`
          git clone --branch v${VERSION} https://github.com/${{ github.repository }}.git pan_mail_pro
          \`\`\`

          Upgrading an existing database runs every migration between your
          installed version and this one: \`-u pan_mail_pro\`.
          EOF
